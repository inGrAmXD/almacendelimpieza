# Servicios principales
services:
  - title: "Distribución Mayorista"
    description: "Productos de limpieza profesional por mayor con precios competitivos y entregas programadas."
    icon: "truck"
    
  - title: "Asesoramiento Técnico"
    description: "Recomendamos los productos más adecuados según el tipo de establecimiento y necesidades."
    icon: "shield"
    
  - title: "Entregas Programadas"
    description: "Sistema de entregas regulares para garantizar que nunca te quedes sin stock."
    icon: "clock"

# Rubros que atienden
sectors:
  - title: "Comercios Gastronómicos"
    description: "Productos especializados para restaurantes, bares, comedores y todo tipo de establecimientos gastronómicos."
    icon: "restaurant"
    products:
      - "Desengrasantes industriales"
      - "Detergentes para vajilla"
      - "Sanitizantes de superficies"
      - "Productos para pisos de alto tránsito"
      
  - title: "Cadenas Gastronómicas"
    description: "Asesoramiento personalizado para cadenas gastronómicas y centros de producción alimenticias."
    icon: "factory"
    products:
      - "Sistemas de limpieza automática"
      - "Productos de gran formato"
      - "Soluciones industriales"
      - "Asesoramiento técnico especializado"
      
  - title: "Hotelería"
    description: "Soluciones integrales de limpieza para hoteles, hostales y establecimientos de alojamiento."
    icon: "hotel"
    products:
      - "Productos para habitaciones"
      - "Limpieza de baños y sanitarios"
      - "Ambientadores profesionales"
      - "Productos para áreas comunes"
      
  - title: "Colegios e Instituciones"
    description: "Productos seguros y efectivos para centros educativos y espacios con alta concurrencia."
    icon: "school"
    products:
      - "Desinfectantes certificados"
      - "Productos seguros para niños"
      - "Limpieza de aulas y comedores"
      - "Sistemas de higiene personal"
      
  - title: "Centros Médicos"
    description: "Productos especializados para residencias geriátricas, clínicas y centros de salud."
    icon: "medical"
    products:
      - "Desinfectantes hospitalarios"
      - "Productos bactericidas"
      - "Limpieza de equipamiento médico"
      - "Soluciones de alta bioseguridad"
      
  - title: "Empresas en General"
    description: "Atención personalizada para oficinas, industrias y todo tipo de empresas."
    icon: "building"
    products:
      - "Productos para oficinas"
      - "Limpieza industrial"
      - "Mantenimiento de instalaciones"
      - "Soluciones corporativas"

