# Información principal de la empresa
company:
  name: "Almacén de Limpieza"
  tagline: "la diferencia está en el servicio"
  description: "Somos una distribuidora especializada en productos de limpieza profesional. Vendemos a comercios gastronómicos & brindamos asesoramiento personalizado a cadenas gastronómicas y centros de producción alimenticias. Atendemos hotelería, colegios, residencias geriátricas, centros médicos y empresas."

# Misión, Visión y Valores sugeridos
mission: "Proveer productos de limpieza de alta calidad que garanticen la máxima higiene y seguridad en establecimientos gastronómicos, contribuyendo al éxito de nuestros clientes a través de soluciones eficientes y confiables."

vision: "Ser la distribuidora líder en productos de limpieza profesional para el sector gastronómico, reconocida por nuestra calidad, servicio y compromiso con la excelencia."

values:
  - title: "Calidad"
