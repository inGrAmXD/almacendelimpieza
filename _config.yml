# Configuración del sitio
title: "Almacén de Limpieza Argentina - Distribuidora de Productos de Limpieza Profesional"
description: "🧽 Almacén de limpieza profesional en Argentina. Distribuidora especializada en productos de limpieza por mayor para gastronomía, hotelería, colegios, residencias geriátricas, centros médicos y empresas. +15 años de experiencia. Entrega en CABA y GBA."
url: "https://almacendelimpieza.com"
baseurl: ""

# SEO
author: "Almacén de Limpieza"
keywords: "almacén de limpieza, almacén de limpieza argentina, productos de limpieza por mayor, distribuidora productos limpieza, limpieza profesional gastronómica, artículos limpieza restaurantes, productos químicos profesionales, limpieza industrial, hotelería, colegios, residencias geriátricas, centros médicos, almacén limpieza CABA, almacén limpieza Buenos Aires"

# Configuración de Jekyll
markdown: kramdown
highlighter: rouge
permalink: pretty
timezone: America/Argentina/Buenos_Aires

# Plugins para SEO
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

# Configuración de SEO
twitter:
  username: almacen_limpieza # Cambiar cuando tengan redes

facebook:
  app_id: # Agregar cuando tengan Facebook
  publisher: # Agregar cuando tengan Facebook

# Schema.org
social:
  name: Almacén de Limpieza
  links:
    - https://www.instagram.com/almacen_limpieza # Agregar cuando tengan
    - https://www.facebook.com/almacen_limpieza # Agregar cuando tengan

# Configuración local
locale: es_AR

# Exclusiones
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/ 