# Configuración del sitio
title: "Almacén de Limpieza - Distribuidora de Productos de Limpieza Profesional"
description: "Distribuidora especializada en productos de limpieza profesional. Vendemos a comercios gastronómicos & brindamos asesoramiento personalizado a cadenas gastronómicas y centros de producción alimenticias. Atendemos hotelería, colegios, residencias geriátricas, centros médicos y empresas."
url: "https://tudominio.com" # Cambiar por tu dominio
baseurl: ""

# SEO
author: "Almacén de Limpieza"
keywords: "distribuidora productos limpieza, limpieza profesional gastronómica, productos limpieza por mayor, artículos limpieza restaurantes, limpieza industrial, productos químicos profesionales, hotelería, colegios, residencias geriátricas, centros médicos"

# Configuración de Jekyll
markdown: kramdown
highlighter: rouge
permalink: pretty
timezone: America/Argentina/Buenos_Aires

# Plugins para SEO
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

# Configuración de SEO
twitter:
  username: almacen_limpieza # Cambiar cuando tengan redes

facebook:
  app_id: # Agregar cuando tengan Facebook
  publisher: # Agregar cuando tengan Facebook

# Schema.org
social:
  name: Almacén de Limpieza
  links:
    - https://www.instagram.com/almacen_limpieza # Agregar cuando tengan
    - https://www.facebook.com/almacen_limpieza # Agregar cuando tengan

# Configuración local
locale: es_AR

# Exclusiones
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/ 